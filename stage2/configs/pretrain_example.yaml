# Stage2 example; replace paths and set source-specific clocks/statistics.
common:
  video_height: 384
  video_width: 640
  num_views: 2
  video_action_freq_ratio: 6
  max_latent_window: 8
  chunk_window_range:
  - 1
  - 3
  chunk_window_size: 2
  video_rope_mode: window
  video_view_rope_mode: hw_offset
  wrist_xyz_abs_max: 10.0
dataset:
  type: pretrain
  episode_index_source: jsonl
  jsonl_path:
  - /path/to/pretrain_index.jsonl
  stereo_latent_sources_path: configs/pretrain_sources_example.json
  source_weighted_sampling: true
  latent_root: video_features/wan2.2
  latent_phases:
  - 0
  latent_max_attempts: 3
  min_total_latent_frames: 4
  lang_root: text_features/UMT5
  lang_subpath: null
  action_stats_path: /path/to/action_stats.json
  action:
    raw_hz: 60
    train_hz: 30
  mask_invalid_hand_tracking: true
model:
  normalization:
    hand: min_max
    wrist_xyz: min_max
  wan:
    checkpoint_path: /path/to/Wan2.2-TI2V-5B
    precision: bfloat16
    gradient_checkpointing: false
  action_expert:
    hidden_size: 1024
    ffn_dim_multiplier: 4
    norm_eps: 1.0e-06
  fixed_chunk_size: 2
  use_state: false
  action_mode: qpos20_rel6d
  mode: joint
  video_timestep_shift: 5.0
  action_timestep_shift: 1.0
  wm_ratio: 0.1
  inference:
    num_inference_timesteps: 5
  loss_weights:
    video_loss_weight: 1.0
    action_loss_weight: 1.0
    uniform_loss_weight_warmup_steps: 10000
    hand_qpos_loss_weight: 1.0
    rel_eef_position_loss_weight: 1.0
    rel_eef_rotation_loss_weight: 1.0
  noisy_history_prob: 0.0
  value:
    enabled: true
    target: vlac
    num_value_tokens: 1
    num_bins: 201
    value_loss_weight: 0.05
    vm_ratio: 0.05
training:
  batch_size: 1
  gradient_accumulation_steps: 8
  bucket_by_resolution: true
  max_steps: 1000000
  learning_rate: 2.0e-05
  weight_decay: 0.01
  scheduler_type: constant
  warmup_steps: 1000
  f_start: 0.0
  f_max: 1.0
  grad_clip_norm: 0.5
system:
  checkpoint_dir: ./checkpoints
  log_interval: 1
  save_interval: 5000
  eval_enabled: false
  val_interval: 2000
  distributed_timeout_sec: 1800
  num_workers: 16
  prefetch_factor: 4
  pin_memory: true
logging:
  report_to: tensorboard
  tensorboard_log_dir: tensorboard_logs
  run_name: null
resume:
  checkpoint_path: null
finetune:
  checkpoint_path: /path/to/Motus2_stage1/model.pt
